# Pluggable agent backend. Do not hard-code a vendor.
# Live runs: replace command with the real CLI; set model_id to an exact API id.

[agent]
# Placeholders: {python} {root} {work} {patch} {task}
command = "{python} {root}/fixtures/llm_arm/fake_agent.py --work {work} --patch {patch} --tokens 100"

[budget]
