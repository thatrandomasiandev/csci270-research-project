[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acts-memo"
version = "0.3.0a1"
description = "TARE engine (research package name acts-memo). Do not publish until Josh approves — the name 'acts' is taken on PyPI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joshua Terranova" }]

[project.scripts]
acts = "acts.__main__:main"
tare = "acts.tare_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acts*"]
exclude = ["tests*", "fixtures*", "scripts*", "docs*", "results*", "jobs*"]
